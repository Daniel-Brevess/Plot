<ion-content>
  <div class="container">
    <h2>Editar Perfil</h2>

    <img [src]="foto" class="avatar" alt="Foto do perfil" (click)="escolherFoto()" />
    <input type="file" hidden accept="image/*" (change)="onFileSelected($event)" />

    <div class="photo-actions">
      <ion-button fill="outline" type="button" (click)="escolherFoto()" [disabled]="carregandoFoto">
        Escolher foto
      </ion-button>

      <ion-button fill="outline" type="button" (click)="tirarFoto()" [disabled]="carregandoFoto">
        Tirar foto
      </ion-button>
    </div>

    <button type="button" class="file-fallback" (click)="selecionarArquivo()">
      Selecionar arquivo
    </button>

    <ion-input placeholder="Nome" [(ngModel)]="user.nome"></ion-input>

    <ion-input
      placeholder="Email"
      [value]="email"
      [readonly]="true"
      [disabled]="true">
    </ion-input>

    <ion-button expand="block" (click)="salvar()" [disabled]="salvando || !user.nome.trim()">
      {{ salvando ? 'Salvando...' : 'Salvar Alteracoes' }}
    </ion-button>

    <section class="password-section">
      <h3>Mudar senha</h3>

      <ion-input
        type="password"
        placeholder="Senha atual"
        [(ngModel)]="senhaAtual">
      </ion-input>

      <ion-input
        type="password"
        placeholder="Nova senha"
        [(ngModel)]="novaSenha">
      </ion-input>

      <ion-input
        type="password"
        placeholder="Confirmar nova senha"
        [(ngModel)]="confirmarSenha">
      </ion-input>

      <ion-button
        expand="block"
        type="button"
        (click)="alterarSenha()"
        [disabled]="alterandoSenha">
        {{ alterandoSenha ? 'Alterando...' : 'Alterar senha' }}
      </ion-button>
    </section>
  </div>
</ion-content>
