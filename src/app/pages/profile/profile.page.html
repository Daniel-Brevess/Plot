<ion-content [forceOverscroll]="false">
  <div class="profile-header">
    <div class="top-actions">
      <ion-back-button defaultHref="/" text="" mode="md"></ion-back-button>
      <a routerLink="/edit-profile" aria-label="Editar perfil">
        <ion-icon name="create-outline" class="menu-icon"></ion-icon>
      </a>
    </div>

    <div class="user-info">
      <div class="avatar-wrapper">
        <img [src]="foto" [alt]="nome" />
      </div>
      <h1 class="user-name">{{ nome }}</h1>
      <p class="user-handle">{{ email }}</p>
    </div>

    <div class="status-tags">
      <div class="tag"></div>
      <div class="tag"></div>
      <div class="tag"></div>
    </div>

    <ion-button fill="clear" class="logout-button" (click)="sair()">
      <ion-icon name="log-out-outline" slot="start"></ion-icon>
      Sair
    </ion-button>
  </div>

  <div class="favorites-section">
    <h3 class="section-title">Favoritos:</h3>

    <div class="book-list">
      <div class="book-item">
        <div class="book-cover-placeholder"></div>
        <div class="book-details">
          <h4>Crime e castigo</h4>
          <p>Autor: Dostoiévski</p>
        </div>
      </div>

      <div class="book-item">
        <div class="book-cover-placeholder"></div>
        <div class="book-details">
          <h4>O Retrato</h4>
          <p>Autor: Dorian Gray</p>
        </div>
      </div>

      <div class="book-item">
        <div class="book-cover-placeholder"></div>
        <div class="book-details">
          <h4>Hábitos Atômicos</h4>
          <p>Autor: James Clear</p>
        </div>
      </div>
    </div>
  </div>
</ion-content>
