<ion-content [forceOverscroll]="false">
  <div class="profile-header">
    <div class="top-actions">
      <ion-back-button defaultHref="/" text="" mode="md"></ion-back-button>
      <a routerLink="/edit-profile" aria-label="Editar perfil">
        <ion-icon name="create-outline" class="menu-icon"></ion-icon>
      </a>
    </div>

    <div class="user-info">
      <div class="avatar-wrapper">
        <img [src]="foto" [alt]="nome" />
      </div>
      <h1 class="user-name">{{ nome }}</h1>
      <p class="user-handle">{{ email }}</p>
    </div>

    <div class="status-tags">
      <div class="tag"></div>
      <div class="tag"></div>
      <div class="tag"></div>
    </div>

    <ion-button fill="clear" class="logout-button" (click)="sair()">
      <ion-icon name="log-out-outline" slot="start"></ion-icon>
      Sair
    </ion-button>
  </div>

  <div class="favorites-section">
    <h3 class="section-title">Favoritos</h3>

    <div *ngIf="carregandoFavoritos" class="favorite-state">
      <p>Carregando favoritos...</p>
    </div>

    <div *ngIf="!carregandoFavoritos && erroFavoritos" class="favorite-state error">
      <p>{{ erroFavoritos }}</p>
    </div>

    <div *ngIf="!carregandoFavoritos && !erroFavoritos && favoritos.length === 0" class="favorite-state empty">
      <ion-icon name="heart-outline"></ion-icon>
      <p>Nenhum livro favorito ainda.</p>
    </div>

    <div class="book-list" *ngIf="!carregandoFavoritos && favoritos.length > 0">
      <article class="book-item" *ngFor="let livro of favoritos">
        <a class="book-link" [routerLink]="['/books', livro.id]">
          <img [src]="livro.capa" [alt]="livro.titulo" class="book-cover" />

          <div class="book-details">
            <h4>{{ livro.titulo }}</h4>
            <p>{{ livro.autores.join(', ') }}</p>
            <span *ngIf="livro.primeiraPublicacao">{{ livro.primeiraPublicacao }}</span>
          </div>
        </a>

        <button
          type="button"
          class="remove-favorite"
          [disabled]="removendoFavorito === livro.id"
          (click)="removerFavorito($event, livro.id)"
          aria-label="Remover dos favoritos">
          <ion-icon name="trash-outline"></ion-icon>
        </button>
      </article>
    </div>
  </div>
</ion-content>
